<script>
const PAGE_DEFS=[
 {id:'geral',label:'Visão Geral',icon:'📊'}, {id:'pendencias',label:'Pendências',icon:'📦'}, {id:'sla',label:'Performance SLA',icon:'⏱️'}, {id:'transportadoras',label:'Transportadoras',icon:'🚚'}, {id:'performanceuf',label:'Performance UF',icon:'📍'}, {id:'ocorrencias',label:'Ocorrências',icon:'⚠️'}];
const COLORS=['#0b2b59','#8b95a5'];
const KEY=['N° AUTORIZAÇÃO','NF','Data Solicitação SIT','Concessionaria','Cidade','UF','Transportadora','Status por NF','Ocorrência','Aging em Aberto','Performance'];
const FILTERS=[['Ano','__ano'],['Mês','__mes'],['Transportadora','Transportadora'],['Região','Região'],['UF','UF'],['Status','Status por NF'],['Performance','Performance']];
let raw=[], filtered=[], fullFiltered=[], page='geral', cross={}, charts={}, sortState={col:'',asc:true};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const norm=v=>(v??'').toString().trim();
const parseDate=v=>{let m=norm(v).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null};
const numBR=v=>{let s=norm(v);if(!s||/CANCEL|EXTRAV|#|SEM/i.test(s))return 0;return Number(s.replace(/\./g,'').replace(',','.'))||0};
const fmt=n=>new Intl.NumberFormat('pt-BR').format(n||0), money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n||0);
const pending=r=>/^\d-Pendente/i.test(norm(r['Status por NF']));
const overdue=r=>/Fora do Prazo/i.test(norm(r.Performance));
const final=r=>/Finalizado/i.test(norm(r['Status por NF']));
const operational=r=>!/Cancelado|Extravio/i.test(norm(r['Status por NF']));
const validFinal=r=>final(r)&&!/Cancelado|Extravio/i.test(norm(r['Status por NF']));
const noPrazoFinal=r=>validFinal(r)&&/No Prazo/i.test(norm(r['SLA Entrega']));
function init(){
 $('#menu').innerHTML=PAGE_DEFS.map((p,i)=>`<button class="${i?'':'active'}" data-page="${p.id}">${p.icon} &nbsp; ${p.label}</button>`).join('');
 $('#filters').innerHTML=FILTERS.map(([l,k])=>`<select data-key="${k}"><option value="">Todos • ${l}</option></select>`).join('');
 $('#pages').innerHTML=PAGE_DEFS.map(p=>`<section class="page ${p.id==='geral'?'active':''}" id="page-${p.id}"><div class="cards" id="cards-${p.id}"></div><div class="grid" id="grid-${p.id}"></div>${p.id==='pendencias'?'':tableHTML(p.id)}</section>`).join('');
 $$('#menu button').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
 $$('#filters select').forEach(s=>s.onchange=apply); $('#search').oninput=debounce(apply,180); $('#clearBtn').onclick=()=>{cross={};$('#search').value='';$$('#filters select').forEach(s=>s.value='');apply()};
 $('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');$('#themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';localStorage.setItem('gm-theme',document.body.className);render()};
 $('#fileInput').onchange=e=>loadCSV(e.target.files[0]); document.body.classList.remove('dark');$('#themeBtn').textContent='🌙';localStorage.setItem('gm-theme','light')
}
function tableHTML(id){return `<div class="panel table-panel"><div class="panel-head"><h3>Base detalhada filtrada</h3><span class="hint">Clique em uma linha para abrir os detalhes</span></div><div class="selection" id="chips-${id}"></div><div class="table-tools"><input id="tableSearch-${id}" placeholder="Pesquisar nesta tabela"><button class="btn" onclick="exportCSV()">Exportar filtrado</button><span id="tableCount-${id}"></span></div><div class="table-wrap"><table id="table-${id}"></table></div></div>`}
function processParsedRows(rows,file){try{raw=rows.filter(x=>Object.values(x).some(v=>norm(v))).map(x=>{let d=parseDate(x['Data Solicitação SIT'])||parseDate(x['Data de Criação']);x.__ano=d?String(d.getFullYear()):'Sem data';x.__mes=d?String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'Sem data';let dc=parseDate(x['Data de Criação']),ds=parseDate(x['Data Solicitação SIT']);x.__sitCompare=dc&&ds&&dc.getTime()===ds.getTime()?'Dentro do prazo • mesma data':'Fora do prazo • data diferente';let tc=norm(x.Transportadora),te=norm(x['Transportadora Entrega']);x.__carrierCompare=!tc||!te?'Sem informação':tc.toUpperCase()===te.toUpperCase()?'Sim • mesma transportadora':'Não • transportadoras diferentes';let cte=norm(x['Nº CTE Ceva']),em=norm(x['Data Emissão CTRC']),bad=v=>/^(|SEM CTE|CANCELADO|EXTRAVIO|#N\/D|#REF!)$/i.test(v);x.__cteState=bad(cte)?'Sem número de CTE':bad(em)?'CTE emitido sem data':'CTE emitido com data';return x});let saved=file&&file.lastModified?new Date(file.lastModified):new Date(),dd=String(saved.getDate()).padStart(2,'0'),mm=String(saved.getMonth()+1).padStart(2,'0'),yyyy=saved.getFullYear(),hh=String(saved.getHours()).padStart(2,'0'),mi=String(saved.getMinutes()).padStart(2,'0');if($('#baseBadge'))$('#baseBadge').textContent=`🕘 Base CSV: ${dd}/${mm}/${yyyy} ${hh}:${mi}`;$('#notice').style.display='none';populateFilters();filtered=raw;cross={};apply()}catch(e){console.error(e);alert('Erro ao processar a base: '+e.message)}finally{$('#loading').classList.remove('show')}}
function loadCSV(file){if(!file)return;$('#loading').classList.add('show');let timeout=setTimeout(()=>$('#loading').classList.remove('show'),30000),reader=new FileReader();reader.onerror=()=>{clearTimeout(timeout);$('#loading').classList.remove('show');alert('Não foi possível ler o CSV')};reader.onload=()=>Papa.parse(reader.result,{header:true,delimiter:';',skipEmptyLines:true,worker:false,complete:r=>{clearTimeout(timeout);processParsedRows(r.data,file)},error:e=>{clearTimeout(timeout);$('#loading').classList.remove('show');alert('Erro no CSV: '+e.message)}});reader.readAsText(file,'UTF-8')}

function draw(id,key,entries,type,horizontal,isMoney,forcedColor=''){let el=$('#'+id);if(!el)return;let labels=entries.map(x=>x[0]),values=entries.map(x=>x[1]);const critical=/fora|atras|venc|extravio|cancel/i.test(id+' '+key+' '+labels.join(' '));const occurrence=/ocor/i.test(id+' '+key);const order=[...document.querySelectorAll('.chart-wrap canvas')].indexOf(el);const color=forcedColor||(id==='cStatus'?'#0b2b59':critical?'#ef3340':occurrence?'#f59e0b':(order%2===0?'#0b2b59':'#8b95a5'));const finalType=type==='line'?'line':'bar';charts[id]=new Chart(el,{type:finalType,plugins:finalType==='bar'?[barValueLabels]:[],data:{labels,datasets:[{label:finalType==='line'?(id==='oMes'?'Ocorrências':'Processos'):'Quantidade',data:values,backgroundColor:color,borderColor:color,borderRadius:finalType==='bar'?6:0,borderWidth:finalType==='line'?2:0,tension:.3,fill:false}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:180},indexAxis:horizontal?'y':'x',layout:{padding:{right:30,top:14}},plugins:{legend:{display:finalType==='line',labels:{color:getComputedStyle(document.body).getPropertyValue('--text')}},tooltip:{callbacks:{label:c=>` ${fmt(c.raw)}`}}},scales:{x:{beginAtZero:true,ticks:{color:getComputedStyle(document.body).getPropertyValue('--muted'),font:{size:9}},grid:{display:false}},y:{beginAtZero:true,ticks:{color:getComputedStyle(document.body).getPropertyValue('--muted'),font:{size:9}},grid:{display:false}}},onClick:(e,els)=>{if(els.length)setCross(key,labels[els[0].index])}}})}

function renderTableInto(t,d,cols){if(!t)return;t.innerHTML='<thead><tr>'+cols.map(c=>`<th data-col="${esc(c)}">${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+d.map((r,i)=>'<tr data-i="'+i+'">'+cols.map(c=>`<td class="${KEY.includes(c)?'key-col':''}">${cell(c,r[c])}</td>`).join('')+'</tr>').join('')+'</tbody>';[...t.querySelectorAll('tbody tr')].forEach((tr,i)=>tr.onclick=()=>openDetails(d[i]));[...t.querySelectorAll('th')].forEach(th=>th.onclick=()=>{let c=th.dataset.col;d.sort((a,b)=>norm(a[c]).localeCompare(norm(b[c]),'pt-BR',{numeric:true})*(sortState.col===c&&sortState.asc?-1:1));sortState={col:c,asc:!(sortState.col===c&&sortState.asc)};renderTableInto(t,d,cols)})}
