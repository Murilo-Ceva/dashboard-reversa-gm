<style>
:root{--bg:#f3f6fb;--panel:#fff;--text:#101828;--muted:#667085;--line:#d8e0ec;--nav:#071e42;--blue:#1769e0;--cyan:#12b8c8;--green:#20b26b;--red:#ef3340;--orange:#f59e0b;--purple:#7c3aed;--gray:#8291a8;--yellow:#fff3bf;--shadow:0 5px 20px #17355a14;--sidebar:210px}
body.dark{--bg:#0b1220;--panel:#111b2e;--text:#eef4ff;--muted:#aab7cd;--line:#273550;--nav:#071326;--yellow:#4d4214;--shadow:0 6px 24px #0005}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}button,select,input{font:inherit}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--nav);color:#fff;padding:14px 10px;z-index:20;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:9px;padding:4px 7px 15px;border-bottom:1px solid #ffffff25}.logo-box{height:38px;width:86px;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden}.ceva{font-size:22px;font-weight:900;font-style:italic;color:#071e42;letter-spacing:-2px}.gm{width:42px;height:38px;border:2px solid #2d7ded;border-radius:9px;display:grid;place-items:center;color:#2d7ded;background:white;font-weight:900}.brand small{color:#b9c8e5}.menu{margin-top:16px;display:grid;gap:5px}.menu button{border:0;background:transparent;color:#c7d4e9;padding:11px;border-radius:9px;text-align:left;cursor:pointer;font-weight:700}.menu button:hover,.menu button.active{background:#1769e0;color:white}.side-foot{margin-top:auto;color:#93a6c3;font-size:11px;padding:8px}.main{margin-left:var(--sidebar);min-width:0}.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}.topline{display:flex;gap:10px;align-items:center}.title{font-size:20px;font-weight:850;white-space:nowrap}.search{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:750}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.import-label{display:inline-flex;align-items:center}.filters{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:7px;margin-top:8px}.filters select{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)}.content{padding:12px 14px 24px}.notice{background:#e8f2ff;color:#1452a3;border:1px solid #bcd8ff;padding:10px;border-radius:10px;margin-bottom:10px}.dark .notice{background:#102a4d;color:#b9daff;border-color:#234f82}.cards{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:9px;margin-bottom:10px}.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);min-height:84px;cursor:pointer}.card:hover{transform:translateY(-1px)}.card .label{text-transform:uppercase;font-size:10px;color:var(--muted);font-weight:850;letter-spacing:.6px}.card .value{font-size:24px;font-weight:900;margin-top:5px}.card .sub{font-size:10px;color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:11px;min-width:0}.panel h3{font-size:13px;margin:0}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.hint{color:var(--muted);font-size:10px}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-8{grid-column:span 8}.span-12{grid-column:span 12}.chart-wrap{height:245px;position:relative}.table-panel{margin-top:10px}.selection{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 8px}.chip{background:#e8f2ff;color:#1452a3;border-radius:20px;padding:6px 9px;font-weight:700}.dark .chip{background:#18385d;color:#cae2ff}.table-tools{display:flex;gap:8px;align-items:center;margin-bottom:7px}.table-tools input{padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;flex:1}.table-wrap{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:9px}table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:11px}th{position:sticky;top:0;background:#0b2b59;color:#fff;z-index:2;padding:8px;text-align:left;white-space:nowrap;cursor:pointer}td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}tbody tr:hover{background:#1769e012}.key-col{background:var(--yellow)}.status-pill{padding:3px 7px;border-radius:12px;font-weight:800}.good{background:#d9f7e8;color:#087542}.bad{background:#ffe0e0;color:#b51e2a}.warn{background:#fff0cc;color:#8a5700}.dark .good{background:#164932;color:#c5f4dc}.dark .bad{background:#56242a;color:#ffd9dd}.dark .warn{background:#594619;color:#ffecbd}.empty{padding:55px 20px;text-align:center;color:var(--muted);font-size:15px}.drawer{position:fixed;top:0;right:-520px;width:500px;max-width:95vw;height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 30px #0004;z-index:50;transition:.25s;padding:18px;overflow:auto}.drawer.open{right:0}.drawer .close{float:right}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.detail{background:var(--bg);padding:9px;border-radius:8px}.detail b{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.page{display:none}.page.active{display:block}.mobile-menu{display:none}
@media(max-width:1450px){:root{--sidebar:185px}.content{padding:9px 10px}.top{padding:8px 10px}.cards{gap:7px}.card{min-height:75px;padding:8px 10px}.card .value{font-size:21px}.chart-wrap{height:215px}.filters{grid-template-columns:repeat(7,minmax(90px,1fr))}.panel{padding:9px}.title{font-size:18px}}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.span-4,.span-6,.span-8{grid-column:span 12}.filters{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.main{margin-left:0}.mobile-menu{display:block}.topline{flex-wrap:wrap}.title{font-size:17px}.search{order:5;flex-basis:100%}.filters{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}

.sidebar{background:var(--panel);color:var(--text);padding:0 10px;border-right:1px solid var(--line);box-shadow:2px 0 15px #10294a12}.brand{height:108px;display:flex;justify-content:center;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line)}.brand-ceva{display:block;max-width:182px;max-height:72px;object-fit:contain}.side-name{padding:20px 12px 8px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:1.5px}.menu{margin-top:4px}.menu button{color:var(--muted);border-radius:10px;padding:12px}.menu button:hover,.menu button.active{background:#1769e014;color:var(--blue);box-shadow:inset 4px 0 var(--blue)}.side-foot{border-top:1px solid var(--line);padding:14px 6px;display:flex;align-items:center;gap:10px;color:var(--muted)}.brand-gm{width:48px;height:48px;object-fit:contain;flex:0 0 auto}.chart-wrap{height:290px}.panel{min-width:0}.loading-mask{position:fixed;inset:0;background:#08172bd9;color:#fff;z-index:99;display:none;place-items:center;text-align:center}.loading-mask.show{display:grid}.loading-ring{width:44px;height:44px;border:5px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:850px){.sidebar{background:var(--panel)}.brand{height:90px}.brand-ceva{max-height:60px}}
.base-badge{height:38px;display:flex;align-items:center;padding:0 11px;border:1px solid #bcd8ff;border-radius:10px;background:#e8f2ff;color:#1452a3;font-size:11px;font-weight:850;white-space:nowrap}.dark .base-badge{background:#102a4d;color:#b9daff;border-color:#234f82}.brand{height:126px!important;padding:10px!important}.brand-ceva{max-width:198px!important;max-height:92px!important}.side-foot{justify-content:center!important;padding:16px 8px!important}.brand-gm{width:68px!important;height:68px!important}.brand,.side-foot{background:#fff!important;border-radius:12px}.dark .brand,.dark .side-foot{background:#fff!important}.dark .brand-ceva,.dark .brand-gm{filter:none!important}@media(max-width:1100px){.base-badge{order:6}}@media(max-width:760px){.base-badge{width:100%;justify-content:center;order:6}.brand{height:108px!important}}
.brand,.side-foot,.dark .brand,.dark .side-foot{background:var(--panel)!important;border-radius:0!important}.dark .brand-ceva,.dark .brand-gm{filter:drop-shadow(0 1px 2px #0008)!important}.brand-ceva{max-width:210px!important;max-height:96px!important}.brand-gm{width:78px!important;height:78px!important}

<script>
const PAGE_DEFS=[
 {id:'geral',label:'Visão Geral',icon:'▦'}, {id:'pendencias',label:'Pendências',icon:'⚠'}, {id:'sla',label:'Performance SLA',icon:'◷'}, {id:'transportadoras',label:'Transportadoras',icon:'▰'}, {id:'ocorrencias',label:'Ocorrências',icon:'◉'}];
const COLORS=['#0b2b59','#8b95a5'];
const KEY=['N° AUTORIZAÇÃO','NF','Data Solicitação SIT','Concessionaria','Cidade','UF','Transportadora','Status por NF','Ocorrência','Aging em Aberto','Performance'];
const FILTERS=[['Ano','__ano'],['Mês','__mes'],['Transportadora','Transportadora'],['Região','Região'],['UF','UF'],['Status','Status por NF'],['Performance','Performance']];
let raw=[], filtered=[], page='geral', cross={}, charts={}, sortState={col:'',asc:true};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const norm=v=>(v??'').toString().trim();
const parseDate=v=>{let m=norm(v).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null};
const numBR=v=>{let s=norm(v);if(!s||/CANCEL|EXTRAV|#|SEM/i.test(s))return 0;return Number(s.replace(/\./g,'').replace(',','.'))||0};
const fmt=n=>new Intl.NumberFormat('pt-BR').format(n||0), money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n||0);
const pending=r=>/^\d-Pendente/i.test(norm(r['Status por NF']));
const overdue=r=>/Fora do Prazo/i.test(norm(r.Performance));
const final=r=>/Finalizado/i.test(norm(r['Status por NF']));
const validFinal=r=>final(r)&&!/Cancelado|Extravio/i.test(norm(r['Status por NF']));
const noPrazoFinal=r=>validFinal(r)&&/No Prazo/i.test(norm(r['SLA Entrega']));
function init(){
 $('#menu').innerHTML=PAGE_DEFS.map((p,i)=>`<button class="${i?'':'active'}" data-page="${p.id}">${p.icon} &nbsp; ${p.label}</button>`).join('');

function tableHTML(id){return `<div class="panel table-panel"><div class="panel-head"><h3>Base detalhada filtrada</h3><span class="hint">Clique em uma linha para abrir os detalhes</span></div><div class="selection" id="chips-${id}"></div><div class="table-tools"><input id="tableSearch-${id}" placeholder="Pesquisar nesta tabela"><button class="btn" onclick="exportCSV()">Exportar filtrado</button><span id="tableCount-${id}"></span></div><div class="table-wrap"><table id="table-${id}"></table></div></div>`}
function loadCSV(file){if(!file)return;$('#loading').classList.add('show');requestAnimationFrame(()=>{Papa.parse(file,{header:true,skipEmptyLines:true,worker:true,complete:r=>{raw=r.data.map(x=>{let d=parseDate(x['Data Solicitação SIT'])||parseDate(x['Data de Criação']);x.__ano=d?String(d.getFullYear()):'Sem data';x.__mes=d?String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'Sem data';return x});const saved=file.lastModified?new Date(file.lastModified):new Date();const dd=String(saved.getDate()).padStart(2,'0'),mm=String(saved.getMonth()+1).padStart(2,'0'),yyyy=saved.getFullYear(),hh=String(saved.getHours()).padStart(2,'0'),mi=String(saved.getMinutes()).padStart(2,'0');$('#baseBadge').textContent=`🕘 Base CSV: ${dd}/${mm}/${yyyy} ${hh}:${mi}`;$('#notice').style.display='none';populateFilters();apply();$('#loading').classList.remove('show')},error:e=>{$('#loading').classList.remove('show');alert('Não foi possível ler o CSV: '+e.message)}})})}
function populateFilters(){FILTERS.forEach(([l,k])=>{let s=document.querySelector(`select[data-key="${k}"]`),old=s.value,vals=[...new Set(raw.map(r=>norm(r[k])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));s.innerHTML=`<option value="">Todos • ${l}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join('');s.value=old})}
function apply(){let q=norm($('#search').value).toLowerCase();filtered=raw.filter(r=>{for(const s of $$('#filters select'))if(s.value&&norm(r[s.dataset.key])!==s.value)return false;for(const [k,v] of Object.entries(cross))if(norm(r[k])!==v)return false;if(q&&!['NF','N° AUTORIZAÇÃO','Nº CTE Ceva','Concessionaria','Cidade','Chave'].some(k=>norm(r[k]).toLowerCase().includes(q)))return false;return true});render()}
function switchPage(id){page=id;$$('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+id));$$('#menu button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));$('#pageTitle').textContent=PAGE_DEFS.find(x=>x.id===id).label;sidebar.classList.remove('open');render()}

function card(label,val,sub,color='#1769e0',key='',value=''){return `<div class="card" style="border-top-color:${color}" ${key?`onclick="setCross('${js(key)}','${js(value)}')"`:''}><div class="label">${label}</div><div class="value">${val}</div><div class="sub">${sub||''}</div></div>`}
function renderCards(){let d=filtered,total=d.length,pendRows=d.filter(pending),pend=pendRows.length,finRows=d.filter(final),fin=finRows.length,canc=d.filter(r=>/Cancelado/i.test(norm(r['Status por NF']))).length,ext=d.filter(r=>/Extravio/i.test(norm(r['Status por NF']))).length,vol=d.reduce((a,r)=>a+numBR(r.Volume),0);let finNP=finRows.filter(r=>/No Prazo/i.test(norm(r['SLA Entrega']))).length,finFP=finRows.filter(r=>/Fora/i.test(norm(r['SLA Entrega']))).length,pendNP=pendRows.filter(r=>/No Prazo/i.test(norm(r.Performance))).length,pendFP=pendRows.filter(r=>/Fora/i.test(norm(r.Performance))).length;let items=[card('Total processos',fmt(total),'no filtro'),card('Finalizados',fmt(fin),`NP ${fmt(finNP)} • FP ${fmt(finFP)}`,'#20b26b','Status por NF','Finalizado'),card('Pendentes',fmt(pend),`NP ${fmt(pendNP)} • FP ${fmt(pendFP)}`,'#f59e0b'),card('Volumes',fmt(vol),'coluna F','#0b2b59'),card('Cancelados',fmt(canc),'processos cancelados','#8291a8','Status por NF','Cancelado'),card('Extravios',fmt(ext),'processos extraviados','#ef3340','Status por NF','Extravio')];if(page==='pendencias'){items=items.filter((x,i)=>![0,1].includes(i));items.splice(1,0,card('Pendente no prazo',fmt(pendNP),'NP','#20b26b','Performance','Pendente No Prazo'),card('Pendente fora do prazo',fmt(pendFP),'FP','#ef3340','Performance','Pendente Fora do Prazo'))}$(`#cards-${page}`).innerHTML=items.join('')}
function validFinalCount(d){return d.filter(validFinal).length}

function slaOTD(col){let a=filtered.filter(r=>/Realizada No Prazo/i.test(norm(r[col]))).length,b=filtered.filter(r=>/Realizada Fora Prazo/i.test(norm(r[col]))).length;return a+b?(100*a/(a+b)).toFixed(1).replace('.',',')+'%':'0,0%'}
function validOccurrence(r){return !final(r)&&!/COMPROVANTE DE ENTREGA EM SISTEMA/i.test(norm(r.Ocorrência))&&norm(r.Ocorrência)}

function group(key,filterFn=()=>true,sumKey=null){let m={};filtered.filter(filterFn).forEach(r=>{let k=norm(r[key])||'Sem informação';m[k]=(m[k]||0)+(sumKey?numBR(r[sumKey]):1)});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,15)}

const outsideLabels={id:'outsideLabels',afterDatasetsDraw(chart,args,options){if(chart.config.type!=='doughnut')return;const {ctx,chartArea}=chart,meta=chart.getDatasetMeta(0),vals=chart.data.datasets[0].data,total=vals.reduce((a,b)=>a+(+b||0),0);if(!total)return;ctx.save();ctx.font='600 10px Segoe UI,Arial';ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text').trim()||'#101828';ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--muted').trim()||'#667085';ctx.lineWidth=1;meta.data.forEach((arc,i)=>{if(!vals[i])return;const a=(arc.startAngle+arc.endAngle)/2,side=Math.cos(a)>=0?1:-1,r=arc.outerRadius,p1={x:arc.x+Math.cos(a)*(r+2),y:arc.y+Math.sin(a)*(r+2)},p2={x:arc.x+Math.cos(a)*(r+13),y:arc.y+Math.sin(a)*(r+13)},p3={x:p2.x+side*13,y:p2.y};ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.stroke();const pct=100*vals[i]/total,label=`${fmt(vals[i])} (${pct.toFixed(2).replace('.',',')}%)`;ctx.textAlign=side>0?'left':'right';ctx.textBaseline='middle';ctx.fillText(label,p3.x+side*3,p3.y)});ctx.restore()}};
const barValueLabels={id:'barValueLabels',afterDatasetsDraw(chart){if(chart.config.type!=='bar')return;const ctx=chart.ctx,meta=chart.getDatasetMeta(0),values=chart.data.datasets[0].data;ctx.save();ctx.font='800 10px Segoe UI,Arial';meta.data.forEach((bar,i)=>{const val=values[i];const horizontal=chart.options.indexAxis==='y';if(horizontal){const start=chart.scales.x.getPixelForValue(0),w=Math.abs(bar.x-start),inside=w>48;ctx.textAlign=inside?'right':'left';ctx.textBaseline='middle';ctx.fillStyle=inside?'#fff':getComputedStyle(document.body).getPropertyValue('--text').trim();ctx.fillText(fmt(val),inside?bar.x-6:bar.x+6,bar.y)}else{const base=chart.scales.y.getPixelForValue(0),h=Math.abs(base-bar.y),inside=h>28;ctx.textAlign='center';ctx.textBaseline=inside?'top':'bottom';ctx.fillStyle=inside?'#fff':getComputedStyle(document.body).getPropertyValue('--text').trim();ctx.fillText(fmt(val),bar.x,inside?bar.y+5:bar.y-4)}});ctx.restore()}};
function draw(id,key,entries,type,horizontal,isMoney,forcedColor=''){let el=$('#'+id);if(!el)return;let labels=entries.map(x=>x[0]),values=entries.map(x=>x[1]);const critical=/fora|atras|venc|extravio|cancel/i.test(id+' '+key+' '+labels.join(' '));const occurrence=/ocor/i.test(id+' '+key);const order=[...document.querySelectorAll('.chart-wrap canvas')].indexOf(el);const color=forcedColor||(id==='cStatus'?'#0b2b59':critical?'#ef3340':occurrence?'#f59e0b':(order%2===0?'#0b2b59':'#8b95a5'));const finalType=type==='line'?'line':'bar';charts[id]=new Chart(el,{type:finalType,plugins:finalType==='bar'?[barValueLabels]:[],data:{labels,datasets:[{label:finalType==='line'?(id==='oMes'?'Ocorrências':'Processos'):'Quantidade',data:values,backgroundColor:color,borderColor:color,borderRadius:finalType==='bar'?6:0,borderWidth:finalType==='line'?2:0,tension:.3,fill:false}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:180},indexAxis:horizontal?'y':'x',layout:{padding:{right:30,top:14}},plugins:{legend:{display:finalType==='line',labels:{color:getComputedStyle(document.body).getPropertyValue('--text')}},tooltip:{callbacks:{label:c=>` ${fmt(c.raw)}`}}},scales:{x:{beginAtZero:true,ticks:{color:getComputedStyle(document.body).getPropertyValue('--muted'),font:{size:9}},grid:{display:false}},y:{beginAtZero:true,ticks:{color:getComputedStyle(document.body).getPropertyValue('--muted'),font:{size:9}},grid:{color:getComputedStyle(document.body).getPropertyValue('--line')}}},onClick:(e,els)=>{if(els.length)setCross(key,labels[els[0].index])}}})}
function chartPerformancePend(id){
 let d=filtered.filter(pending),np=d.filter(r=>/No Prazo/i.test(norm(r.Performance))).length,fp=d.filter(r=>/Fora/i.test(norm(r.Performance))).length,el=$('#'+id);
 charts[id]=new Chart(el,{
  type:'bar',plugins:[barValueLabels],

 });

function chartRealizadasMes(id){let m={};filtered.forEach(r=>{let d=parseDate(r['Data de Entrega']);if(!d)return;let sla=norm(r['SLA Entrega']),k=String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();if(!/Realizada (No Prazo|Fora Prazo)/i.test(sla))return;m[k]??={np:0,fp:0,date:d};if(/Realizada No Prazo/i.test(sla))m[k].np++;else if(/Realizada Fora Prazo/i.test(sla))m[k].fp++});let e=Object.entries(m).sort((a,b)=>a[1].date-b[1].date),el=$('#'+id);charts[id]=new Chart(el,{type:'bar',data:{labels:e.map(x=>x[0]),datasets:[{label:'Realizada no prazo',data:e.map(x=>x[1].np),backgroundColor:'#0b2b59',borderRadius:5},{label:'Realizada fora do prazo',data:e.map(x=>x[1].fp),backgroundColor:'#8b95a5',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom',labels:{color:getComputedStyle(document.body).getPropertyValue('--text'),boxWidth:10}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,grid:{color:getComputedStyle(document.body).getPropertyValue('--line')}}}}})}

function renderTable(){let id=page,input=$(`#tableSearch-${id}`);if(input&&!input.dataset.bound){input.oninput=()=>renderTable();input.dataset.bound=1}let q=input?norm(input.value).toLowerCase():'';let d=q?filtered.filter(r=>Object.values(r).some(v=>norm(v).toLowerCase().includes(q))):filtered;let cols=KEY.concat(Object.keys(raw[0]||{}).filter(k=>!KEY.includes(k)&&!k.startsWith('__')));$(`#tableCount-${id}`).textContent=fmt(d.length)+' registros';$(`#chips-${id}`).innerHTML=Object.entries(cross).map(([k,v])=>`<span class="chip">${esc(k)}: ${esc(v)} ×</span>`).join('');renderTableInto($(`#table-${id}`),d.slice(0,350),cols)}
function renderTableInto(t,d,cols){if(!t)return;t.innerHTML='<thead><tr>'+cols.map(c=>`<th data-col="${esc(c)}">${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+d.map((r,i)=>'<tr data-i="'+i+'">'+cols.map(c=>`<td class="${KEY.includes(c)?'key-col':''}">${cell(c,r[c])}</td>`).join('')+'</tr>').join('')+'</tbody>';[...t.querySelectorAll('tbody tr')].forEach((tr,i)=>tr.onclick=()=>openDetails(d[i]));[...t.querySelectorAll('th')].forEach(th=>th.onclick=()=>{let c=th.dataset.col;d.sort((a,b)=>norm(a[c]).localeCompare(norm(b[c]),'pt-BR',{numeric:true})*(sortState.col===c&&sortState.asc?-1:1));sortState={col:c,asc:!(sortState.col===c&&sortState.asc)};renderTableInto(t,d,cols)})}

function exportCSV(){let csv=Papa.unparse(filtered,{delimiter:';'}),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gm_reversa_filtrado.csv';a.click();URL.revokeObjectURL(a.href)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
