<script>
const PAGE_DEFS=[
 {id:'geral',label:'Visão Geral',icon:'📊'}, {id:'janela',label:'Janela GM',icon:'📅'}, {id:'pendencias',label:'Pendências',icon:'📦'}, {id:'sla',label:'Performance SLA',icon:'⏱️'}, {id:'transportadoras',label:'Transportadoras',icon:'🚚'}, {id:'performanceuf',label:'Performance UF',icon:'📍'}, {id:'ocorrencias',label:'Ocorrências',icon:'⚠️'}];
const COLORS=['#0b2b59','#8b95a5'];
const KEY=['N° AUTORIZAÇÃO','NF','Data Solicitação SIT','Concessionaria','Cidade','UF','Transportadora','Status por NF','Ocorrência','Aging em Aberto','Performance'];
const FILTERS=[['Ano','__ano'],['Mês de entrega','__entMes'],['Mês da NF','__criMes'],['Mês de previsão','__prevMes'],['Transportadora','Transportadora'],['Região','Região'],['UF','UF'],['Status','Status por NF'],['Performance','Performance'],['Observação (AC)','Observação']];
let raw=[], filtered=[], fullFiltered=[], page='geral', cross={}, charts={}, sortState={col:'',asc:true}, selectedFilters={}, janelaMode='monthly', forecastMode='monthly', chartDateRange=null, fullAccess=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const norm=v=>(v??'').toString().trim();
const parseDate=v=>{let m=norm(v).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?new Date(+m[3],+m[2]-1,+m[1]):null};
const numBR=v=>{let s=norm(v);if(!s||/CANCEL|EXTRAV|#|SEM/i.test(s))return 0;return Number(s.replace(/\./g,'').replace(',','.'))||0};
const fmt=n=>new Intl.NumberFormat('pt-BR').format(n||0), money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n||0);
const pending=r=>/^\d-Pendente/i.test(norm(r['Status por NF']));
const overdue=r=>/Fora do Prazo/i.test(norm(r.Performance));
const final=r=>/Finalizado/i.test(norm(r['Status por NF']));
const operational=r=>!/Cancelado/i.test(norm(r['Status por NF']));
const validFinal=r=>final(r)&&!/Cancelado/i.test(norm(r['Status por NF']));
const noPrazoFinal=r=>validFinal(r)&&/No Prazo/i.test(norm(r['SLA Entrega']));
function init(){document.body.classList.add('client-view');
 $('#menu').innerHTML=PAGE_DEFS.map((p,i)=>`<button class="${i?'':'active'}" data-page="${p.id}">${p.icon} &nbsp; ${p.label}</button>`).join('');
 $('#filters').innerHTML=FILTERS.map(([l,k])=>multiFilterHTML(l,k)).join('');
 $('#pages').innerHTML=PAGE_DEFS.map(p=>`<section class="page ${p.id==='geral'?'active':''}" id="page-${p.id}"><div class="active-filter-bar" id="activeFilters-${p.id}"></div><div class="cards" id="cards-${p.id}"></div><div class="executive-summary" id="summary-${p.id}"></div><div class="grid" id="grid-${p.id}"></div>${p.id==='pendencias'?'':tableHTML(p.id)}</section>`).join('');
 $$('#menu button').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));updateAccessUI();
 initMultiFilters();$('#lockBtn').onclick=toggleAccess; $('#search').oninput=debounce(apply,180); $('#clearBtn').onclick=()=>{cross={};selectedFilters={};chartDateRange=null;$('#search').value='';refreshAllFilterUI();apply()}; $('#homeBtn').onclick=()=>{cross={};selectedFilters={};chartDateRange=null;$('#search').value='';refreshAllFilterUI();switchPage('geral')};
 $('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');$('#themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';localStorage.setItem('gm-theme',document.body.className);render()};
 $('#fileInput').onchange=e=>loadCSV(e.target.files[0]); document.body.classList.remove('dark');$('#themeBtn').textContent='🌙';localStorage.setItem('gm-theme','light')

function weekdayCapacity(day){return day>=1&&day<=4?500:day===5?200:0}
function dateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayLabel(d){return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`}
function weekStart(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
/* Feriados nacionais oficiais de 2026. Pontos facultativos nao sao descontados. */
const NATIONAL_HOLIDAYS_2026=new Set(['2026-01-01','2026-04-03','2026-04-21','2026-05-01','2026-09-07','2026-10-12','2026-11-02','2026-11-15','2026-11-20','2026-12-25']);
function isNationalHoliday(d){return d.getFullYear()===2026&&NATIONAL_HOLIDAYS_2026.has(dateISO(d))}
function janelaRows(){return fullFiltered.filter(r=>{let d=parseDate(r['Data de Entrega']),v=numBR(r.Volume);return d&&v>0})}
function selectedCalendarRanges(rows){
 let src=(selectedFilters.__prevMes&&selectedFilters.__prevMes.size)?selectedFilters.__prevMes:selectedFilters.__entMes;let months=src&&src.size?[...src]:[];
 if(months.length){return months.map(m=>{let z=m.match(/^(\d{2})\/(\d{4})$/);if(!z)return null;let y=+z[2],mo=+z[1]-1;return [new Date(y,mo,1),new Date(y,mo+1,0)]}).filter(Boolean).sort((a,b)=>a[0]-b[0])}
 let years=selectedFilters.__ano&&selectedFilters.__ano.size?[...selectedFilters.__ano].filter(x=>/^\d{4}$/.test(x)):[];
 if(years.length)return years.map(y=>[new Date(+y,0,1),new Date(+y,11,31)]).sort((a,b)=>a[0]-b[0]);
 let ds=rows.map(r=>parseDate(r['Data de Entrega'])).filter(Boolean).sort((a,b)=>a-b);
 return ds.length?[[new Date(ds[0].getFullYear(),ds[0].getMonth(),ds[0].getDate()),new Date(ds.at(-1).getFullYear(),ds.at(-1).getMonth(),ds.at(-1).getDate())]]:[]
}
function buildJanelaSeries(mode=janelaMode){
 let rows=janelaRows(),daily=new Map();
 rows.forEach(r=>{let d=parseDate(r['Data de Entrega']),k=dateISO(d);daily.set(k,(daily.get(k)||0)+numBR(r.Volume))});
 let ranges=selectedCalendarRanges(rows);if(!ranges.length)return [];
 let business=[];
 ranges.forEach(([min,max])=>{for(let d=new Date(min);d<=max;d.setDate(d.getDate()+1)){let actual=daily.get(dateISO(d))||0,cap=weekdayCapacity(d.getDay());if(isNationalHoliday(d))cap=0;if(!cap&&!actual)continue;business.push({date:new Date(d),label:dayLabel(d),actual,projected:cap,pct:cap?actual/cap*100:0,outside:!cap&&actual>0})}});
 if(mode==='daily')return business;
 if(mode==='monthly'){let months=new Map();business.forEach(x=>{let k=`${x.date.getFullYear()}-${String(x.date.getMonth()+1).padStart(2,'0')}`;if(!months.has(k))months.set(k,{date:new Date(x.date.getFullYear(),x.date.getMonth(),1),label:`${String(x.date.getMonth()+1).padStart(2,'0')}/${x.date.getFullYear()}`,actual:0,projected:0});let m=months.get(k);m.actual+=x.actual;m.projected+=x.projected});return [...months.values()].sort((a,b)=>a.date-b.date).map(x=>({...x,pct:x.projected?x.actual/x.projected*100:0}))}
 let weeks=new Map();business.forEach(x=>{let ws=weekStart(x.date),k=dateISO(ws);if(!weeks.has(k))weeks.set(k,{date:ws,label:`Sem. ${dayLabel(ws)}`,actual:0,projected:0});let w=weeks.get(k);w.actual+=x.actual;w.projected+=x.projected});
 return [...weeks.values()].sort((a,b)=>a.date-b.date).map(x=>({...x,pct:x.projected?x.actual/x.projected*100:0}))
}
function janelaStats(){let series=buildJanelaSeries(),actual=series.reduce((a,x)=>a+x.actual,0),projected=series.reduce((a,x)=>a+x.projected,0),forecast=fullFiltered.reduce((a,r)=>a+(parseDate(r['Previsão Entrega'])?numBR(r.Volume):0),0),delivered=fullFiltered.reduce((a,r)=>a+(parseDate(r['Data de Entrega'])?numBR(r.Volume):0),0),pct=projected?actual/projected*100:0,diff=projected-actual;return {series,actual,projected,pct,diff,forecast,delivered}}

function chartRealizadasMes(id){let m={};filtered.forEach(r=>{let d=parseDate(r['Data de Entrega']),c=realizedClass(r['SLA Entrega']);if(!d||!c)return;let k=String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();m[k]??={np:0,fp:0,date:d};if(c==='NP')m[k].np++;else m[k].fp++});let e=Object.entries(m).sort((a,b)=>a[1].date-b[1].date),el=$('#'+id);charts[id]=new Chart(el,{type:'bar',plugins:[barValueLabels],data:{labels:e.map(x=>x[0]),datasets:[{label:'Realizada no prazo',data:e.map(x=>x[1].np),backgroundColor:'#0b2b59',borderRadius:5},{label:'Realizada fora do prazo',data:e.map(x=>x[1].fp),backgroundColor:'#8b95a5',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:12}},plugins:{legend:{display:true,position:'bottom',labels:{color:getComputedStyle(document.body).getPropertyValue('--text'),boxWidth:10}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,grid:{display:false}}}}})}

function renderPendingTable(pd){$('#pCount').textContent=fmt(pd.length)+' registros';let cols=fullAccess?KEY:KEY.filter(k=>!/Transportadora/i.test(k));renderTableInto($('#pendingTable'),pd,cols)}
let tablePages={};
function renderTable(){let id=page,input=$(`#tableSearch-${id}`),sizeEl=$(`#pageSize-${id}`);if(input&&!input.dataset.bound){input.oninput=()=>{tablePages[id]=1;renderTable()};input.dataset.bound=1}if(sizeEl&&!sizeEl.dataset.bound){sizeEl.onchange=()=>{tablePages[id]=1;renderTable()};sizeEl.dataset.bound=1}let q=input?norm(input.value).toLowerCase():'',source=fullFiltered.length?fullFiltered:filtered,d=q?source.filter(r=>Object.values(r).some(v=>norm(v).toLowerCase().includes(q))):source,cols=KEY.concat(Object.keys(raw[0]||{}).filter(k=>!KEY.includes(k)&&!k.startsWith('__')));if(!fullAccess)cols=cols.filter(k=>!/Transportadora/i.test(k));let size=+(sizeEl?.value||50),pages=Math.max(1,Math.ceil(d.length/size)),pg=Math.min(tablePages[id]||1,pages);tablePages[id]=pg;$(`#tableCount-${id}`).textContent=`${fmt(d.length)} registros • página ${pg}/${pages}`;$(`#chips-${id}`).innerHTML=Object.entries(cross).map(([k,v])=>`<span class="chip">${esc(k)}: ${esc(v)} ×</span>`).join('');renderTableInto($(`#table-${id}`),d.slice((pg-1)*size,pg*size),cols);let pag=$(`#pagination-${id}`);if(pag)pag.innerHTML=`<button class="btn" ${pg<=1?'disabled':''} onclick="changePage('${id}',-1)">← Anterior</button><span>Página ${pg} de ${pages}</span><button class="btn" ${pg>=pages?'disabled':''} onclick="changePage('${id}',1)">Próxima →</button>`}

function renderTableInto(t,d,cols){if(!t)return;t.innerHTML='<thead><tr>'+cols.map(c=>`<th data-col="${esc(c)}">${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+d.map((r,i)=>'<tr data-i="'+i+'">'+cols.map(c=>`<td class="${KEY.includes(c)?'key-col':''}">${cell(c,r[c])}</td>`).join('')+'</tr>').join('')+'</tbody>';[...t.querySelectorAll('tbody tr')].forEach((tr,i)=>tr.onclick=()=>openDetails(d[i]));[...t.querySelectorAll('th')].forEach(th=>th.onclick=()=>{let c=th.dataset.col;d.sort((a,b)=>norm(a[c]).localeCompare(norm(b[c]),'pt-BR',{numeric:true})*(sortState.col===c&&sortState.asc?-1:1));sortState={col:c,asc:!(sortState.col===c&&sortState.asc)};renderTableInto(t,d,cols)})}
function cell(c,v){let s=esc(norm(v));if(/SLA|Performance|Status por NF/.test(c)){let cl=/No Prazo|Finalizado/i.test(s)?'good':/Fora|Extravio/i.test(s)?'bad':'warn';return `<span class="status-pill ${cl}">${s||'-'}</span>`}if(c==='Valor NF')return money(numBR(v));return s||'-'}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
